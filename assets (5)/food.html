<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Ordering Website</title>
    <link rel="stylesheet" href="food.css">
</head>
<body>
    <h1>Food Ordering</h1>
    <div class="menu">
        <h2>Menu</h2>
        <div class="menu-item">
            <span class="item-name">Pizza</span>
            <span class="item-price">$10</span>
            <button onclick="addToCart('Pizza', 10)">Add to Cart</button>
        </div>
        <div class="menu-item">
            <span class="item-name">Burger</span>
            <span class="item-price">$7</span>
            <button onclick="addToCart('Burger', 7)">Add to Cart</button>
        </div>
        <div class="menu-item">
            <span class="item-name">Salad</span>
            <span class="item-price">$5</span>
            <button onclick="addToCart('Salad', 5)">Add to Cart</button>
        </div>
    </div>
    <div class="cart">
        <h2>Cart</h2>
        <ul id="cart-items"></ul>
        <p>Total: $<span id="total-price">0</span></p>
    </div>
</body>
<script>
    let cart = [];
let totalPrice = 0;

function addToCart(itemName, itemPrice) {
    cart.push({ name: itemName, price: itemPrice });
    updateCart();
}

function updateCart() {
    const cartItems = document.getElementById('cart-items');
    cartItems.innerHTML = '';
    
    cart.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.name} - $${item.price}`;
        cartItems.appendChild(li);
    });

    totalPrice = cart.reduce((total, item) => total + item.price, 0);
    document.getElementById('total-price').textContent = totalPrice;
}
</script>
</html>
